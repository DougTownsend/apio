; Apio project configuration file.
;
; Drives a CD74HC4094E 8-bit shift register from a Raspberry Pi Pico.
; See README.md for the wiring and the expected output pattern.
;
; boards.jsonc / fpgas.jsonc / programmers.jsonc in this directory are
; project-local overrides (see docs/custom-boards.md) defining the "pico"
; board, since it isn't (yet) in the upstream apio-definitions repo.

[env:default]
board = pico
top-module = main
constraint-file = main.pcf
