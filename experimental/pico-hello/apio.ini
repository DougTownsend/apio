; Apio project configuration file.
; See https://fpgawars.github.io/apio/project-file for details.
;
; Demonstrates targeting a Raspberry Pi Pico instead of an FPGA: apio
; synthesizes main.v, generates C that interprets it at ~1kHz, compiles it
; with pico-sdk, and 'apio upload' flashes the resulting .uf2 over USB.
;
; The pico board definitions are bundled globally with this Apio fork, so
; this project does not need project-local definition files.

[env:default]
board = pico
top-module = main
constraint-file = main.pcf
